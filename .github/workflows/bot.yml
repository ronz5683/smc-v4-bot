name: scan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run Scanner + OKX V11
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: |
          python smc_v4_github.py
          python smc_okx_demo.py
      - run: |
          git config --global user.name "smc-bot"
          git config --global user.email "bot@smc.com"
          git add last_scan.json okx_demo_log.json okx_debug_report.json
          git commit -m "V12 NO-PAPER $2.5 MAX - $(date -u +%FT%TZ)" || exit 0
          git pull --rebase origin main && git push || true
