name: SMC V4 Live Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run SMC V4 Bot (single scan)
        run: |
          python smc_v4_github.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "SMC Bot"
          git config --global user.email "bot@smc-v4.com"
          git add -A
          git diff --staged --quiet || (git commit -m "auto: scan $(date -u)" && git push)
