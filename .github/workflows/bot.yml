name: SMC V4 Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # tiap 15 menit
  workflow_dispatch:  # biar bisa Run manual

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run SMC Bot
        run: python smc_v4_github.py

      - name: Commit results
        run: |
          git config --global user.name "smc-bot"
          git config --global user.email "bot@smc.com"
          git add last_scan.json positions.json
          git commit -m "bot: update scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "no changes to commit"
          git push
