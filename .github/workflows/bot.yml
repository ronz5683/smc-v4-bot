name: scan

on:
  schedule:
    - cron: '*/15 * * * *'  # DEBUG: 15 menit dulu, setelah fix SL $2 stable ganti ke */30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run SMC Bot V10 M1 TEST 100 trades + OKX DEBUG
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: |
          python smc_v4_github.py
          python smc_okx_demo.py

      - name: Commit only if changed - QUOTA SAVER
        run: |
          git config --global user.name "smc-bot"
          git config --global user.email "bot@smc.com"
          
          # Hanya add file yang berubah, skip kalau sama
          git add last_scan.json positions.json paper_trading.json okx_demo_log.json okx_debug_report.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes - skip push, save quota"
            exit 0
          fi
          
          git commit -m "bot V10.7 DEBUG fix ADA SL case - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main || (git rebase --abort; git reset --hard origin/main; git add last_scan.json positions.json paper_trading.json okx_demo_log.json okx_debug_report.json 2>/dev/null || true; git commit -m "retry - $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true)
          git push
